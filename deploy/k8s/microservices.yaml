apiVersion: apps/v1
kind: Deployment
metadata:
  name: finaware-auth
  namespace: finaware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finaware-auth
  template:
    metadata:
      labels:
        app: finaware-auth
    spec:
      containers:
        - name: finaware-auth
          image: finaware:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma db push && npm run service:auth"]
          ports:
            - containerPort: 4101
          envFrom:
            - configMapRef:
                name: finaware-config
            - secretRef:
                name: finaware-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4101
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4101
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/prisma
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: finaware-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: finaware-auth
  namespace: finaware
spec:
  selector:
    app: finaware-auth
  ports:
    - name: http
      port: 4101
      targetPort: 4101
      protocol: TCP
  type: ClusterIP
