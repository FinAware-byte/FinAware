apiVersion: apps/v1
kind: Deployment
metadata:
  name: finaware-ml-service
  namespace: finaware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finaware-ml-service
  template:
    metadata:
      labels:
        app: finaware-ml-service
    spec:
      containers:
        - name: finaware-ml-service
          # Built from ml-service/Dockerfile; model baked in, runs as non-root (uid 10001).
          image: finaware-ml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: finaware-ml-service
  namespace: finaware
spec:
  selector:
    app: finaware-ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# Why: only the Financial API Service may call the ML Prediction Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finaware-ml-service
  namespace: finaware
spec:
  podSelector:
    matchLabels:
      app: finaware-ml-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: finaware-financial-api
      ports:
        - protocol: TCP
          port: 8000
