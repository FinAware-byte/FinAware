name: CI

# Paused: CI no longer runs on every push or pull request. Run the same checks locally instead
# (npm run lint, npm run typecheck, npm test, npm run ml:test). To switch CI back on, remove the
# "workflow_dispatch" line and un-comment "push" and "pull_request". Until then it only runs when
# started by hand from the Actions tab.
on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --fund=false
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ml.data_audit
      # Provisional until the risk target is approved (docs/risk_tier_methodology.md); then drop the flag.
      - run: python -m ml.train --allow-proposed-target --skip-ablation
      - run: python -m pytest -q
